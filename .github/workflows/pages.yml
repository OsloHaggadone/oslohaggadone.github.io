# Publishes the site on GitHub Pages whenever main changes: the portfolio (the top of the
# repository) at https://oslohaggadone.com, and Synopsist's website (Synopsist/player/) at
# /Synopsist/. Only website files go out; the rest of Synopsist (its code, its catalog) and the notes
# stay in the repository. On GitHub, Settings → Pages → Source must be "GitHub Actions", and the
# domain is set there too, under Custom domain (no CNAME file: a workflow's site ignores one). GitHub
# forwards every oslohaggadone.github.io address to the same path on it. The songs come from the private
# repository OsloHaggadone/synopsist-audio, so a song taken off the site is in no public repository.
name: Publish the site

on:
  push:
    branches: [main]
  workflow_dispatch: # a "Run workflow" button in the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# one publish at a time: a newer push waits for the running one
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      # the songs, from the private repository, read with its read-only deploy key (the
      # AUDIO_DEPLOY_KEY secret); Synopsist/scripts/push_songs.sh puts them there
      - uses: actions/checkout@v7
        with:
          repository: OsloHaggadone/synopsist-audio
          ssh-key: ${{ secrets.AUDIO_DEPLOY_KEY }}
          path: Synopsist/player/library/audio
          persist-credentials: false
      - name: Put the site together
        run: |
          shopt -s extglob
          # only the songs the song list names go out (no .git, no README, nothing taken off the site),
          # and only if every one of them is there: if not, nothing is published and the site stays as it was
          rm -rf Synopsist/player/library/audio/.git
          python3 Synopsist/scripts/check_songs.py --prune
          mkdir _site
          # the portfolio: everything at the top but Synopsist, the contact form's Worker (it runs on
          # Cloudflare), the notes, and the local preview (serve.py); a glob leaves out dotfiles like
          # .github and .gitignore
          cp -r !(Synopsist|contact-worker|_site|README.md|CLAUDE.md|serve.py) _site/
          cp -r Synopsist/player _site/Synopsist
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
